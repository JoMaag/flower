name: "Attack Comparison"
description: "Compare all 7 attack types against baseline on CartPole"
version: "1.0"

base_config:
  env: "CartPole-v1"
  num-server-rounds: 150
  num-workers: 10
  num-byzantine: 3
  use-fedpg-br: true

# Compare all attacks + baseline
parameter_list:
  - attack-type: "zero-gradient"
    num-byzantine: 0
  - attack-type: "random-noise"
    num-byzantine: 3
  - attack-type: "random-action"
    num-byzantine: 3
  - attack-type: "sign-flip"
    num-byzantine: 3
  - attack-type: "fedpg-attack"
    num-byzantine: 3
  - attack-type: "variance-attack"
    num-byzantine: 3
  - attack-type: "reward-flipping"
    num-byzantine: 3

metrics_to_track:
  - avg_reward
  - num_good_agents
  - scsg_steps

tags:
  - attacks
  - comparison
  - security
