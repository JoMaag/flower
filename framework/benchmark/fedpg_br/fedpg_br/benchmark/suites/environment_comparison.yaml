name: "Environment Comparison"
description: "Compare FedPG-BR performance across different RL environments"
version: "1.0"

base_config:
  num-server-rounds: 200
  num-workers: 10
  num-byzantine: 2
  attack-type: "random-noise"
  use-fedpg-br: true

# Simple list iteration (not cartesian product)
parameter_list:
  - env: "CartPole-v1"
  - env: "MountainCar-v0"
  - env: "Acrobot-v1"
  - env: "LunarLander-v2"
  - env: "LunarLander-v3"

metrics_to_track:
  - avg_reward
  - avg_length
  - num_good_agents

tags:
  - environments
  - comparison
  - generalization
