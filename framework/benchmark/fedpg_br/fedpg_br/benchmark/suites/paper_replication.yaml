name: "Paper Replication Suite"
description: "Replicate paper results with hyperparameters from mentor's paper (ideal system, no Byzantine agents)"
version: "1.0"

# Run all three environments with paper hyperparameters
parameter_list:
  # CartPole-v1 with paper hyperparameters
  - env: "CartPole-v1"
    num-server-rounds: 5000
    num-workers: 10
    num-byzantine: 0
    use-fedpg-br: true
    use-adaptive-communication: false

  # LunarLander-v2 with paper hyperparameters
  - env: "LunarLander-v2"
    num-server-rounds: 10000
    num-workers: 10
    num-byzantine: 0
    use-fedpg-br: true
    use-adaptive-communication: false

  # HalfCheetah-v2 with paper hyperparameters
  - env: "HalfCheetah-v2"
    num-server-rounds: 10000
    num-workers: 10
    num-byzantine: 0
    use-fedpg-br: true
    use-adaptive-communication: false

metrics_to_track:
  - avg_reward
  - avg_return
  - num_good_agents
  - scsg_steps
  - batch_size

tags:
  - paper
  - replication
  - ideal-system
  - no-byzantine
