name: "Byzantine Robustness Suite"
description: "Test FedPG-BR resilience against various Byzantine attacks with different ratios"
version: "1.0"

base_config:
  env: "CartPole-v1"
  num-server-rounds: 150
  num-workers: 10
  use-fedpg-br: true

# Creates cartesian product: 5 attacks × 4 Byzantine ratios = 20 runs
parameter_matrix:
  attack-type:
    - "random-noise"
    - "sign-flip"
    - "random-action"
    - "fedpg-attack"
    - "variance-attack"
  num-byzantine:
    - 0   # Baseline (no attacks)
    - 2   # 20% Byzantine
    - 3   # 30% Byzantine
    - 4   # 40% Byzantine

metrics_to_track:
  - avg_reward
  - num_good_agents
  - scsg_steps
  - batch_size

tags:
  - byzantine
  - robustness
  - paper-experiments
