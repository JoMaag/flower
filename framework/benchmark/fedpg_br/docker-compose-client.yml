# FedPG-BR Client-Only Docker Compose
# Use this on client machines for distributed deployment
#
# IMPORTANT: Replace SERVER_IP with the actual server IP address
# IMPORTANT: Change CLIENT_ID for each machine (1, 2, 3, 4)

version: '3.8'

services:
  client:
    build: .
    container_name: fedpg-client
    command: >
      python -m fedpg_br.deploy_client
      --server SERVER_IP:8080
      --id 1
      --env TrafficLight-v1
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1

# Note: Using host network mode allows client to reach server on different machine
# Update the command above with:
# 1. Replace SERVER_IP with actual server IP (e.g., 192.168.1.100:8080)
# 2. Change --id for each client machine (1, 2, 3, 4, etc.)
