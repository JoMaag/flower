[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedpg-br"
version = "0.1.0"
description = "Fault-Tolerant Federated Reinforcement Learning (FedPG-BR)"
requires-python = ">=3.9"
dependencies = [
    "flwr[simulation]>=1.13.0",
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "gymnasium[box2d]>=0.26.0",
    "chardet",
]

[project.optional-dependencies]
dashboard = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.9.0",
]

[project.scripts]
fedpg-dashboard = "fedpg_br.dashboard:start_dashboard"
fedpg-server = "fedpg_br.deploy_server:start_server"
fedpg-client = "fedpg_br.deploy_client:start_client"

[tool.hatch.build.targets.wheel]
packages = ["fedpg_br"]

[tool.flwr.app]
publisher = "fedpg-br"

[tool.flwr.app.components]
serverapp = "fedpg_br.server_app:app"
clientapp = "fedpg_br.client_app:app"

[tool.flwr.app.config]
env = "LunarLander-v3"
num-server-rounds = 150
num-workers = 3
num-byzantine = 0
attack-type = "random-noise"
use-fedpg-br = false
method = "fedpg-br"
# Advanced tuning (overridable from dashboard)
batch-size = 0
lr = 0.0
sigma = 0.0
gamma = 0.0
mini-batch-size = 0
delta = 0.0
max-episode-len = 0
hidden-units = ""
activation = ""
# Adaptive communication settings
use-adaptive-communication = false
divergence-threshold = 0.1
divergence-metric = "l2"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0