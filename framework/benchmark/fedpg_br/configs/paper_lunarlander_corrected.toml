# LunarLander-v2 - Paper Hyperparameters (CORRECTED)
# 10000 maximum TRAJECTORIES (not rounds!)
# With K=10 agents and Bt~32: 10000/(10*32) ≈ 31 rounds

env = "LunarLander-v2"

# Training setup - CORRECTED for trajectory count
num-server-rounds = 50     # ~50 rounds to collect 10000+ trajectories
num-workers = 10           # K = 10 agents
num-byzantine = 0          # No Byzantine agents (α = 0)

# FedPG-BR settings
use-fedpg-br = true

# All other parameters configured in config.py:
# - hidden_units = [64, 64]
# - activation = "tanh"
# - output_activation = "tanh"
# - learning_rate = 1e-3
# - gamma = 0.990
# - batch_size_min = 26, batch_size_max = 38 (avg ~32)
# - mini_batch_size = 8
# - sigma = 0.07
# - delta = 0.6
# - max_episode_len = 1000

# Adaptive communication (optional)
use-adaptive-communication = false
