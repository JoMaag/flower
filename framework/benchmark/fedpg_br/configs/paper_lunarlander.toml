# LunarLander-v2 - Paper Hyperparameters
# From mentor's paper (ideal system, no Byzantine agents)

env = "LunarLander-v2"

# Training setup
num-server-rounds = 10000  # Maximum trajectories
num-workers = 10           # K agents (adjust as needed)
num-byzantine = 0          # No Byzantine agents

# FedPG-BR settings
use-fedpg-br = true

# Network architecture (configured in config.py)
# hidden_units = [64, 64]
# activation = "tanh"
# output_activation = "tanh"

# Learning parameters
# learning-rate = 0.001    # η = 1e-3
# gamma = 0.990            # Discount factor

# Batch sizes
# batch_size_min = 26      # Bt sampled from [26, 38]
# batch_size_max = 38
# mini_batch_size = 8      # bt = 8

# Byzantine robustness parameters
# sigma = 0.07             # Variance bound
# delta = 0.6              # Confidence parameter

# Task horizon
# max_episode_len = 1000   # H for training and test

# Adaptive communication (optional)
use-adaptive-communication = false
