# CartPole-v1 - Paper Hyperparameters (FINAL CORRECTED)
# Based on original implementation analysis
# ~312 rounds to match paper's 5000 trajectory budget and 2.5h runtime

env = "CartPole-v1"

# Training setup - FINAL CORRECTION
num-server-rounds = 312    # Matches original paper's implementation
num-workers = 10           # K = 10 agents
num-byzantine = 0          # α = 0 (no Byzantine for baseline)

# FedPG-BR settings
use-fedpg-br = true

# Paper parameters (from original code):
# - hidden_units = [16, 16]
# - activation = "relu"
# - output_activation = "tanh"
# - learning_rate = 1e-3
# - gamma = 0.999
# - batch_size_min = 12, batch_size_max = 20 (avg ~16)
# - mini_batch_size = 4
# - sigma = 0.06
# - delta = 0.6
# - max_episode_len = 500

# Expected runtime: ~2.5 hours (matching paper)
# Expected final reward: ~475-500

use-adaptive-communication = false
