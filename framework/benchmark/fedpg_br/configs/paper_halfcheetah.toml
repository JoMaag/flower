# HalfCheetah-v2 - Paper Hyperparameters
# From mentor's paper (ideal system, no Byzantine agents)

env = "HalfCheetah-v2"

# Training setup
num-server-rounds = 10000  # Maximum trajectories
num-workers = 10           # K agents (adjust as needed)
num-byzantine = 0          # No Byzantine agents

# FedPG-BR settings
use-fedpg-br = true

# Network architecture (configured in config.py)
# hidden_units = [64, 64]
# activation = "tanh"
# output_activation = "tanh"

# Learning parameters
# learning-rate = 0.00008  # η = 8e-5
# gamma = 0.995            # Discount factor

# Batch sizes
# batch_size_min = 46      # Bt sampled from [46, 50]
# batch_size_max = 50
# mini_batch_size = 16     # bt = 16

# Byzantine robustness parameters
# sigma = 0.9              # Variance bound
# delta = 0.6              # Confidence parameter

# Task horizon
# max_episode_len = 500    # H for training (test uses 1000 but that's in evaluation)

# Adaptive communication (optional)
use-adaptive-communication = false
