# CartPole with Adaptive Communication
# Clients only send updates when policy diverges significantly

env = "CartPole-v1"
num-server-rounds = 150
num-workers = 10
num-byzantine = 0

# Enable adaptive communication
use-adaptive-communication = true
divergence-threshold = 0.1  # Skip if divergence < 0.1
divergence-metric = "l2"    # Options: "l2", "cosine", "max"

# Standard FedPG settings
use-fedpg-br = false
