# HalfCheetah-v2 - Paper Hyperparameters (CORRECTED)
# 10000 maximum TRAJECTORIES (not rounds!)
# With K=10 agents and Bt~48: 10000/(10*48) ≈ 21 rounds

env = "HalfCheetah-v2"

# Training setup - CORRECTED for trajectory count
num-server-rounds = 30     # ~30 rounds to collect 10000+ trajectories
num-workers = 10           # K = 10 agents
num-byzantine = 0          # No Byzantine agents (α = 0)

# FedPG-BR settings
use-fedpg-br = true

# All other parameters configured in config.py:
# - hidden_units = [64, 64]
# - activation = "tanh"
# - output_activation = "tanh"
# - learning_rate = 8e-5
# - gamma = 0.995
# - batch_size_min = 46, batch_size_max = 50 (avg ~48)
# - mini_batch_size = 16
# - sigma = 0.9
# - delta = 0.6
# - max_episode_len = 500 (training)

# Adaptive communication (optional)
use-adaptive-communication = false
