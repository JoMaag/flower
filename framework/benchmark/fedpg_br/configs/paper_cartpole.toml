# CartPole-v1 - Paper Hyperparameters
# From mentor's paper (ideal system, no Byzantine agents)

env = "CartPole-v1"

# Training setup
num-server-rounds = 5000  # Maximum trajectories
num-workers = 10          # K agents (adjust as needed)
num-byzantine = 0         # No Byzantine agents

# FedPG-BR settings
use-fedpg-br = true

# Network architecture (will be set in config.py)
# hidden_units = [16, 16]
# activation = "relu"
# output_activation = "tanh"

# Learning parameters
# learning-rate = 0.001    # η = 1e-3 (set in config.py)
# gamma = 0.999            # Discount factor (set in config.py)

# Batch sizes
# batch_size_min = 12      # Bt sampled from [12, 20]
# batch_size_max = 20
# mini_batch_size = 4      # bt = 4

# Byzantine robustness parameters
# sigma = 0.06             # Variance bound (set in config.py)
# delta = 0.6              # Confidence parameter (set in config.py)

# Task horizon
# max_episode_len = 500    # H for training (set in config.py)

# Adaptive communication (optional)
use-adaptive-communication = false
