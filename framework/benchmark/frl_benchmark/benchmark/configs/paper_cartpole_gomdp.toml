# CartPole-v1 - GOMDP (Simple Averaging Baseline)
# Same hyperparameters as paper, but using simple gradient averaging
# No Byzantine filtering, no SCSG variance reduction

env = "CartPole-v1"
num-server-rounds = 312
num-workers = 10
num-byzantine = 0
method = "gomdp"
use-fedpg-br = false
use-adaptive-communication = false
