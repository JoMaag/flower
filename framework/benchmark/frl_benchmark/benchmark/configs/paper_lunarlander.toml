# LunarLander-v2 - Paper Hyperparameters (FINAL CORRECTED)
# Based on original implementation analysis
# ~323 rounds to match paper's 10000 trajectory budget and 12h runtime

env = "LunarLander-v3"

# Training setup - FINAL CORRECTION
num-server-rounds = 323    # Matches original paper's implementation
num-workers = 10           # K = 10 agents
num-byzantine = 0          # α = 0 (no Byzantine for baseline)

# Algorithm settings
use-fedpg-br = true

# Paper parameters (from original code):
# - hidden_units = [64, 64]
# - activation = "tanh"
# - output_activation = "tanh"
# - learning_rate = 1e-3
# - gamma = 0.990
# - batch_size_min = 26, batch_size_max = 38 (avg ~32)
# - mini_batch_size = 8
# - sigma = 0.07
# - delta = 0.6
# - max_episode_len = 1000

# Expected runtime: ~12 hours (matching paper)
# Expected final reward: ~200-250

use-adaptive-communication = false
