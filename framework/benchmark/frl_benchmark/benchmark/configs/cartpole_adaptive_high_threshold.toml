# CartPole with High Divergence Threshold
# More aggressive communication reduction (skip more rounds)

env = "CartPole-v1"
num-server-rounds = 150
num-workers = 10
num-byzantine = 0

# Enable adaptive communication with high threshold
use-adaptive-communication = true
divergence-threshold = 0.5  # Higher threshold = more skipped rounds
divergence-metric = "l2"

# Standard FedPG settings
use-fedpg-br = false
